name: 功能建议
description: 想要的新功能、界面改进或数据补充
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说清楚「想解决什么问题」比「想加什么按钮」更有用。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便、缺什么信息
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的想法
      description: 希望它长什么样、怎么用
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他替代方案
      description: 现在你用什么办法绕过去的
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: App 版本
      placeholder: 1.2.3
    validations:
      required: false
